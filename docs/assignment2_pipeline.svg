<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #111; }
      .title { font-size: 26px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 700; }
      .small { font-size: 14px; }
      .box { fill: #f8fafc; stroke: #1f2937; stroke-width: 1.4; rx: 8; }
      .part { fill: #eef6ff; stroke: #2563eb; stroke-width: 1.6; rx: 8; }
      .alt { fill: #f7fee7; stroke: #65a30d; stroke-width: 1.6; rx: 8; }
      .out { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.6; rx: 8; }
      .line { stroke: #333; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text class="title" x="28" y="42">Assignment 2 Spark Text Processing Pipeline</text>

  <rect class="box" x="35" y="82" width="180" height="74"/>
  <text class="label" x="65" y="113">Amazon reviews</text>
  <text class="small" x="57" y="137">reviews_devset.json</text>

  <rect class="part" x="270" y="48" width="250" height="150"/>
  <text class="label" x="292" y="80">Part 1: RDD chi-square</text>
  <text class="small" x="292" y="110">parse JSON, tokenize, stopwords</text>
  <text class="small" x="292" y="134">N, Nc, Nt, Ntc with reductions</text>
  <text class="small" x="292" y="158">top 75 terms per category</text>
  <text class="small" x="292" y="182">union dictionary</text>

  <rect class="out" x="575" y="82" width="180" height="74"/>
  <text class="label" x="611" y="113">output_rdd.txt</text>
  <text class="small" x="600" y="137">22 category rows + union</text>

  <rect class="part" x="270" y="245" width="250" height="150"/>
  <text class="label" x="292" y="277">Part 2: DataFrame ML</text>
  <text class="small" x="292" y="307">RegexTokenizer, StopWordsRemover</text>
  <text class="small" x="292" y="331">CountVectorizer, IDF</text>
  <text class="small" x="292" y="355">StringIndexer, ChiSqSelector</text>
  <text class="small" x="292" y="379">top 2000 features overall</text>

  <rect class="out" x="575" y="282" width="180" height="74"/>
  <text class="label" x="613" y="313">output_ds.txt</text>
  <text class="small" x="606" y="337">2000 selected terms</text>

  <rect class="part" x="805" y="210" width="305" height="205"/>
  <text class="label" x="829" y="243">Part 3: Classification</text>
  <text class="small" x="829" y="273">60/20/20 train/validation/test split</text>
  <text class="small" x="829" y="297">feature selector grid:</text>
  <text class="small" x="850" y="321">ChiSq top 2000 vs VarianceThreshold</text>
  <text class="small" x="829" y="345">Normalizer(L2)</text>
  <text class="small" x="829" y="369">OneVsRest(LinearSVC)</text>
  <text class="small" x="829" y="393">grid: regParam, standardization, maxIter</text>

  <rect class="alt" x="805" y="60" width="305" height="95"/>
  <text class="label" x="842" y="92">Acceleration</text>
  <text class="small" x="829" y="120">cache feature matrices once per selector</text>
  <text class="small" x="829" y="142">parallel independent SVM fits</text>

  <path class="line" d="M215,119 C235,119 248,119 270,119"/>
  <path class="line" d="M520,119 C544,119 550,119 575,119"/>
  <path class="line" d="M215,119 C238,176 241,285 270,320"/>
  <path class="line" d="M520,320 C544,320 550,320 575,320"/>
  <path class="line" d="M755,320 C776,320 784,320 805,320"/>
  <path class="line" d="M957,155 C957,174 957,190 957,210"/>

  <text class="small" x="45" y="470">Outputs used in the report: RDD/category chi-square dictionary, DataFrame selected vocabulary, validation/test F1 grid and final classifier metrics.</text>
</svg>
